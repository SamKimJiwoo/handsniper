<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버펑크 FPS 아레나</title>
    <!-- 외부 style.css 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lobby-container">
        <div class="lobby-card">
            <h1>CYBER.ARENA</h1>
            <input type="text" id="server-name-input" class="lobby-input" placeholder="서버 지정 (Sector)" value="Sector-01">
            <input type="text" id="nickname-input" class="lobby-input" placeholder="네트워크 아이디 (ID)" value="NetRunner">
            <button id="create-server-btn" class="lobby-btn">접속 시작</button>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="ui-info">
        <div>SECTOR: <span id="sb-server" style="color: #ff007f;">-</span></div>
        <div>NET-ID: <span id="sb-nickname" style="color: #ff007f;">-</span></div>
        <div id="connection-status" style="color: #f39c12; margin-top: 6px;">링크 연결 중...</div>
    </div>

    <div id="scoreboard">
        <strong style="color: #ff007f; letter-spacing: 1px;">[ 네트워크 현황 ]</strong>
        <hr style="border: 0; border-top: 1px solid #ff007f; margin: 10px 0;">
        <div id="player-list">노드 검색 중...</div>
    </div>

    <div id="pause-menu" class="menu-overlay">
        <div class="menu-box">
            <h2>시스템 중단</h2>
            <button id="btn-resume" class="menu-btn">접속 유지</button>
            <button id="btn-settings" class="menu-btn">네트워크 설정</button>
            <button id="btn-leave" class="menu-btn danger">접속 강제 종료</button>
        </div>
    </div>

    <div id="settings-menu" class="menu-overlay">
        <div class="menu-box">
            <h2>네트워크 설정</h2>
            
            <div class="setting-item">
                <label>시야각 (FOV): <span id="fov-val" style="color:#00ffff">75</span></label>
                <input type="range" id="fov-range" min="50" max="110" value="75">
            </div>

            <div class="setting-item">
                <label>마우스 감도: <span id="sens-val" style="color:#00ffff">1.0</span></label>
                <input type="range" id="sens-range" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="setting-item">
                <label>크로스헤어 스타일</label>
                <select id="crosshair-select">
                    <option value="classic">네온 십자선 (+)</option>
                    <option value="dot">플라즈마 도트 (·)</option>
                    <option value="circle">홀로그램 원 (◎)</option>
                    <option value="T">택티컬 T (T)</option>
                </select>
            </div>

            <div class="setting-item">
                <label>렌더 스케일: <span id="res-val" style="color:#00ffff">100%</span></label>
                <select id="res-select">
                    <option value="1.0">100% (최고 화질)</option>
                    <option value="0.75">75% (최적화)</option>
                    <option value="0.5">50% (성능 우선)</option>
                </select>
            </div>

            <button id="close-settings" class="menu-btn" style="margin-top: 15px;">돌아가기</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
